name: Gerar APK Gastos da Sarah

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Gerar APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar estrutura
        run: |
          echo "Projeto encontrado:"
          find . -maxdepth 3 -type f | sort | head -100
          test -f settings.gradle.kts
          test -f app/build.gradle.kts

      - name: Gerar APK Debug
        run: gradle :app:assembleDebug --stacktrace

      - name: Renomear APK
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk "apk/Gastos-da-Sarah.apk"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Gastos-da-Sarah-APK
          path: apk/Gastos-da-Sarah.apk
          if-no-files-found: error
          retention-days: 30
