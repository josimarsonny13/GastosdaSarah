name: Gerar APK do ZIP

on:
  push:
    branches: [ main ]
    paths:
      - 'GastosdaSarah.zip'
      - '.github/workflows/gerar-apk-do-zip.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Preparar projeto do ZIP
        run: |
          rm -rf projeto_zip
          mkdir projeto_zip
          unzip -q GastosdaSarah.zip -d projeto_zip
          echo "PROJECT_DIR=$(dirname "$(find projeto_zip -name gradlew -type f | head -n 1)")" >> "$GITHUB_ENV"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gerar APK Debug
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Copiar APK
        run: |
          mkdir -p saida
          APK="$(find "$PROJECT_DIR" -path '*/build/outputs/apk/debug/*.apk' -type f | head -n 1)"
          test -n "$APK"
          cp "$APK" saida/Gastos-da-Sarah.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Gastos-da-Sarah-APK
          path: saida/Gastos-da-Sarah.apk
