name: Gerar APK do ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "GastosdaSarah.zip"

jobs:
  gerar-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Descompactar ZIP
        shell: bash
        run: |
          rm -rf projeto_zip
          mkdir projeto_zip
          unzip -q GastosdaSarah.zip -d projeto_zip
          echo "Conteudo do ZIP:"
          find projeto_zip -maxdepth 3 -type f | head -100

      - name: Localizar projeto Android
        id: projeto
        shell: bash
        run: |
          BUILD=$(find projeto_zip -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -1)

          if [ -z "$BUILD" ]; then
            echo "ERRO: settings.gradle ou settings.gradle.kts nao encontrado."
            exit 1
          fi

          DIR=$(dirname "$BUILD")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Projeto Android encontrado em: $DIR"

      - name: Gerar APK
        shell: bash
        run: |
          cd "${{ steps.projeto.outputs.dir }}"
          gradle assembleDebug --stacktrace

      - name: Localizar APK
        id: apk
        shell: bash
        run: |
          APK=$(find "${{ steps.projeto.outputs.dir }}" -type f -path "*/outputs/apk/debug/*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK nao encontrado."
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/GastosdaSarah.apk"
          echo "APK criado com sucesso."

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: GastosdaSarah-APK
          path: GastosdaSarah.apk
          if-no-files-found: error
